<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AskMed — Clinical Question Answering System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container">
    <section class="card hero">
      <div class="badge">ASKMED</div>
      <h1>Clinical Question Answering System</h1>
      <p>Ask medical, clinical, healthcare, biomedical, or public-health questions.</p>
    </section>

    <section class="card">
      <label for="question">Your medical question</label>
      <textarea id="question" maxlength="2000" placeholder="Example: What are common symptoms of anemia?"></textarea>
      <button id="askBtn" type="button">Ask Medical Question</button>
      <p class="hint">Educational information only. Not a replacement for a qualified healthcare professional.</p>
    </section>

    <section id="result" class="card result hidden">
      <div class="result-meta">
        <span id="classification"></span>
        <span id="confidence"></span>
      </div>
      <div id="answer"></div>
    </section>
  </main>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
